<!doctype html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import Cost Calculator</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#020617;color:#e2e8f0}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .card{background:#0f172acc;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:16px}
    h1{margin:0 0 4px;font-size:22px}
    .grid{display:grid;gap:12px}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0b1226;color:#f8fafc;font-size:14px;outline:none;transition:border-color .15s}
    input:focus,select:focus{border-color:#6366f1}
    input[readonly]{background:#0f1f3a;color:#64748b;cursor:not-allowed}
    label{font-size:12px;color:#94a3b8;display:grid;gap:6px}
    .muted{color:#94a3b8;font-size:12px;margin:4px 0 0}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    td{padding:9px 6px;border-bottom:1px solid #1e293b;font-size:14px}
    td:last-child{text-align:right;font-weight:600;color:#f1f5f9}
    .big{font-size:32px;font-weight:700;color:#f1f5f9}
    .sub{font-size:14px;color:#94a3b8;margin-top:2px}
    .loading{color:#6366f1;font-size:12px;margin-top:4px}
    .header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .lang-bar{display:flex;gap:6px;flex-shrink:0;margin-top:4px}
    .lang-bar button{padding:5px 14px;border-radius:8px;border:1px solid #334155;background:#0b1226;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
    .lang-bar button.active{background:#6366f1;border-color:#6366f1;color:#fff}
    .transport-bar{display:flex;gap:8px;margin-bottom:14px}
    .transport-bar button{flex:1;padding:9px;border-radius:10px;border:1px solid #334155;background:#0b1226;color:#94a3b8;font-size:13px;cursor:pointer;transition:all .15s}
    .transport-bar button.active{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd;font-weight:600}
    .sec-title{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
    .divider{border:none;border-top:1px solid #1e293b;margin:14px 0}
    .auto-row{display:flex;align-items:center;gap:8px;margin-top:10px}
    .auto-row input{width:auto;accent-color:#6366f1}
    .auto-row label{font-size:13px;color:#94a3b8;display:inline}
    @media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}.header-row{flex-direction:column}}
  </style>
</head>
<body>
<div class="wrap">

  <div class="header-row">
    <div>
      <h1 id="t-title">Калькулятор стоимости импорта</h1>
      <p class="muted" id="t-subtitle">Израиль · Полная себестоимость с таможней</p>
    </div>
    <div class="lang-bar">
      <button onclick="setLang('ru')" id="btn-ru" class="active">RU</button>
      <button onclick="setLang('en')" id="btn-en">EN</button>
      <button onclick="setLang('he')" id="btn-he">עב</button>
    </div>
  </div>

  <div class="card">
    <div class="sec-title" id="t-sec-product">Товар</div>
    <div class="grid g3">
      <label id="l-productName">Название товара<input id="productName" type="text" value="Ноутбук" /></label>
      <label id="l-price">Цена товара, USD<input id="price" type="number" value="2200" min="0" step="0.01" /></label>
      <label id="l-quantity">Количество, шт<input id="quantity" type="number" value="1" min="1" step="1" /></label>
    </div>
  </div>

  <div class="card">
    <div class="sec-title" id="t-sec-route">Маршрут</div>
    <div class="transport-bar">
      <button id="tb-sea" class="active" onclick="setTransport('sea')">🚢 <span id="t-sea">Море</span></button>
      <button id="tb-air" onclick="setTransport('air')">✈️ <span id="t-air">Воздух</span></button>
      <button id="tb-land" onclick="setTransport('land')">🚛 <span id="t-land">Суша</span></button>
    </div>
    <div class="grid g2" style="margin-bottom:12px">
      <label id="l-countryFrom">Страна отправления<select id="countryFrom" onchange="onCountryChange()"></select></label>
      <label id="l-countryTo">Страна назначения<select id="countryTo" onchange="onCountryChange()"></select></label>
    </div>
    <div class="grid g2">
      <label id="l-portFrom">Порт / аэропорт отправления<select id="portFrom" onchange="scheduleRecalc()"></select></label>
      <label id="l-portTo">Порт / аэропорт назначения<select id="portTo" onchange="scheduleRecalc()"></select></label>
    </div>
  </div>

  <div class="card">
    <div class="sec-title" id="t-sec-cargo">Груз и доставка</div>
    <div class="grid g4">
      <label id="l-weight">Вес, кг<input id="weight" type="number" value="180" min="0" step="0.01" /></label>
      <label id="l-volume">Объём, м³<input id="volume" type="number" value="1.4" min="0" step="0.01" /></label>
      <label id="l-shipping">Доставка, USD<input id="shipping" type="number" value="613" min="0" step="0.01" /></label>
      <label id="l-insurance">Страхование, USD<input id="insurance" type="number" value="0" min="0" step="0.01" /></label>
    </div>
    <div class="auto-row">
      <input type="checkbox" id="autoShipping" checked onchange="scheduleRecalc()" />
      <label for="autoShipping" id="l-autoShipping">Рассчитать доставку автоматически</label>
    </div>
  </div>

  <div class="card">
    <div class="sec-title" id="t-sec-customs">Таможня и налоги</div>
    <p class="loading" id="loadingIndicator" style="display:none">Загрузка данных...</p>
    <p class="muted" id="marketInfo"></p>
    <div class="grid g4" style="margin-top:10px">
      <label id="l-fxGoods">Курс USD (себест.), ₪<input id="fxGoods" type="number" step="0.0001" value="3.65" /></label>
      <label id="l-fxTax">Курс USD (таможня), ₪<input id="fxTax" type="number" step="0.0001" value="3.65" /></label>
      <label id="l-dutyRate">Пошлина, %<input id="dutyRate" type="number" step="0.1" /></label>
      <label id="l-vatRate">НДС, %<input id="vatRate" type="number" step="0.1" /></label>
    </div>
    <hr class="divider" />
    <div class="grid g4">
      <label id="l-computerFee">Агрот מחשב, ₪<input id="computerFee" type="number" /></label>
      <label id="l-securityFee">Агрот ביטחון, ₪<input id="securityFee" type="number" /></label>
      <label id="l-brokerage">Брокер, ₪<input id="brokerage" type="number" /></label>
      <label id="l-localLogistics">Лог. порт→склад, ₪<input id="localLogistics" type="number" /></label>
    </div>
  </div>

  <div class="card">
    <div class="sec-title" id="t-sec-results">Итого</div>
    <div class="big" id="totalNis">₪0.00</div>
    <div class="sub" id="totalUsd">$0.00</div>
    <table>
      <tr><td id="t-r-cif">CIF (₪)</td><td id="cifNis"></td></tr>
      <tr><td id="t-r-taxbase">База для налогов (₪)</td><td id="taxBaseNis"></td></tr>
      <tr><td id="t-r-duty">Пошлина (₪)</td><td id="dutyNis"></td></tr>
      <tr><td id="t-r-vat">НДС (₪)</td><td id="vatNis"></td></tr>
      <tr><td id="t-r-customs">Таможенные платежи (₪)</td><td id="customsTotal"></td></tr>
      <tr><td id="t-r-logistics">Логистика порт→склад (₪)</td><td id="localLogisticsRow"></td></tr>
      <tr><td id="t-r-broker">Брокер (₪)</td><td id="brokerageRow"></td></tr>
      <tr><td id="t-r-perunit">Себестоимость / ед. (₪)</td><td id="perUnit"></td></tr>
    </table>
  </div>

</div>
<script>

const DEST_COUNTRIES = ['Israel','USA','Canada','Russia','Germany','Netherlands','UK','France','Australia','UAE','Turkey','Brazil','Mexico','Kazakhstan'];
const ORIGIN_COUNTRIES = Object.keys(PORTS);

let transport = 'sea';
let currentLang = 'ru';

const $ = id => document.getElementById(id);
const num = id => { const v = Number.parseFloat($(id)?.value); return Number.isNaN(v) || v < 0 ? 0 : v; };
const fmt = (v, c='ILS') => new Intl.NumberFormat('en-US',{style:'currency',currency:c,minimumFractionDigits:2}).format(v||0);

function buildSelect(el, options) {
  el.innerHTML = options.map(o => `<option value="${o}">${o}</option>`).join('');
}

function populateCountries() {
  buildSelect($('countryFrom'), ORIGIN_COUNTRIES);
  buildSelect($('countryTo'),   DEST_COUNTRIES);
  $('countryFrom').value = 'China';
  $('countryTo').value   = 'Israel';
}

function onCountryChange() {
  const from = $('countryFrom').value;
  const to   = $('countryTo').value;
  buildSelect($('portFrom'), (PORTS[from]||{})[transport] || ['—']);
  buildSelect($('portTo'),   (PORTS[to]  ||{})[transport] || ['—']);
  scheduleRecalc();
}

function setTransport(t) {
  transport = t;
  ['sea','air','land'].forEach(x => $('tb-'+x).classList.toggle('active', x===t));
  onCountryChange();
}

function setLang(lang) {
  currentLang = lang;
  const tr = LANG[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir  = tr.dir;
  ['ru','en','he'].forEach(l => $('btn-'+l).classList.toggle('active', l===lang));
  Object.entries(tr).forEach(([key, val]) => {
    if (key==='dir' || key==='loading') return;
    const el = $(key);
    if (!el) return;
    if (el.tagName === 'LABEL') {
      let tn = [...el.childNodes].find(n => n.nodeType===3);
      if (tn) tn.textContent = val;
      else el.insertBefore(document.createTextNode(val), el.firstChild);
    } else {
      el.textContent = val;
    }
  });
  $('loadingIndicator').textContent = tr['loading'];
}

const CUSTOMS_IDS = ['dutyRate','vatRate','fxTax','fxGoods','computerFee','securityFee','localLogistics','brokerage'];
const userEdited = new Set();
CUSTOMS_IDS.forEach(id => $(id)?.addEventListener('input', () => userEdited.add(id)));

// ── FREIGHT RATES (2025 market data) ─────────────────────────

// Sources: Sino-Shipping, Agora Freight, Tonlexing, WebCargo (Jan 2026)

const AIR_RATES = {
  China:       { Israel:6.0, USA:5.0, Canada:5.2, Germany:5.5, Netherlands:5.5, UK:5.8, France:5.5, Australia:5.0, Russia:7.0, UAE:4.5, default:6.0 },

function getRate(table, from, to) {
  const row = table[from] || table['default'] || {};
  return row[to] || row['default'] || (table['default'] || {})['default'] || 100;
}

const shippingEstimate = () => {
  const vol = num('volume');
  const wt  = num('weight');
  const from = $('countryFrom').value;
  const to   = $('countryTo').value;

  if (transport === 'sea') {
    const cbm  = vol > 0 ? vol : Math.max(1, wt / 350); // estimate if no volume
    const cbmCharged = Math.max(1, cbm);                  // min 1 CBM
    const rate = getRate(SEA_RATES, from, to);             // $/CBM market rate
    const portInspection = cbmCharged <= 4 ? 115 : 210;   // Israel port inspection
    return cbmCharged * rate + portInspection;
  }

  if (transport === 'air') {
    const volumetricKg  = vol * 167;                       // IATA: 1 CBM = 167 kg
    const chargeableKg  = Math.max(wt, volumetricKg, 45); // min 45 kg
    const rate = getRate(AIR_RATES, from, to);             // $/kg market rate
    return chargeableKg * rate;
  }

  // Land: rough estimate based on weight + distance factor
  const distFactor = { Turkey:1.2, Russia:2.5, Kazakhstan:2.8, Germany:3.5, Poland:3.2, default:3.0 };
  const df = distFactor[from] || distFactor['default'];
  return Math.max(200, (wt * 1.2 + vol * 80) * df);
};

const fallbackCustoms = () => {
  const wt=num('weight'), vol=num('volume'), price=num('price');
  const handling=Math.max(1,Math.ceil(Math.max(wt/120,vol/1.5)));
  const fxG=Math.max(0.0001,num('fxGoods'));
  return {
    dutyRate:0, vatRate:18,
    fxTax:         Number(fxG.toFixed(4)),
    computerFee:   Number((32+handling*6).toFixed(2)),
    securityFee:   Number((38+handling*5).toFixed(2)),
    localLogistics:Number((1800+wt*1.9+vol*420).toFixed(2)),
    brokerage:     Number((290+price*0.012).toFixed(2)),
    source:'fallback'
  };
};

let recalcTimer=null, recalcVersion=0;

async function recalc() {
  const ver = ++recalcVersion;
  $('loadingIndicator').style.display='inline';
  const customs = fallbackCustoms();
  if (ver!==recalcVersion) return;

  CUSTOMS_IDS.forEach(k => {
    const el=$(k);
    if (el && !userEdited.has(k) && customs[k]!==undefined) el.value=customs[k];
  });
  $('loadingIndicator').style.display='none';
  const from = $('countryFrom').value, to = $('countryTo').value;
  const rateInfo = transport==='sea'
    ? `Море LCL: $${getRate(SEA_RATES,from,to)}/м³ + портовый сбор Израиль`
    : transport==='air'
    ? `Авиа: $${getRate(AIR_RATES,from,to)}/кг расч. веса (1м³=167кг, мин. 45кг)`
    : 'Суша: расчёт по весу и расстоянию';
  $('marketInfo').textContent=`Ставка фрахта (рынок 2025): ${rateInfo}. Таможня: ${customs.source}.`;

  const isAuto=$('autoShipping').checked;
  const shEl=$('shipping');
  shEl.readOnly=isAuto;
  const shipping=isAuto?shippingEstimate():num('shipping');
  if(isAuto) shEl.value=shipping.toFixed(2);

  const price=num('price'), ins=num('insurance');
  const fxGoods=Math.max(0.0001,num('fxGoods'));
  const fxTax  =Math.max(0.0001,num('fxTax'));
  const dutyRate=num('dutyRate')/100;
  const vatRate =num('vatRate')/100;
  const qty=Math.max(1,num('quantity'));

  const intlUsd    =shipping+ins;
  const cifNis     =(price+intlUsd)*fxGoods;
  const taxBaseNis =(price+intlUsd)*fxTax;
  const dutyNis    =taxBaseNis*dutyRate;
  const vatNis     =(taxBaseNis+dutyNis)*vatRate;
  const customsTotal=dutyNis+vatNis+num('computerFee')+num('securityFee');
  const totalNis   =cifNis+customsTotal+num('localLogistics')+num('brokerage');
  const totalUsd   =totalNis/fxGoods;

  $('totalNis').textContent         =fmt(totalNis,'ILS');
  $('totalUsd').textContent         =fmt(totalUsd,'USD');
  $('cifNis').textContent           =fmt(cifNis,'ILS');
  $('taxBaseNis').textContent       =fmt(taxBaseNis,'ILS');
  $('dutyNis').textContent          =fmt(dutyNis,'ILS');
  $('vatNis').textContent           =fmt(vatNis,'ILS');
  $('customsTotal').textContent     =fmt(customsTotal,'ILS');
  $('localLogisticsRow').textContent=fmt(num('localLogistics'),'ILS');
  $('brokerageRow').textContent     =fmt(num('brokerage'),'ILS');
  $('perUnit').textContent          =fmt(totalNis/qty,'ILS');
}

function scheduleRecalc() {
  clearTimeout(recalcTimer);
  recalcTimer=setTimeout(recalc,200);
}

document.querySelectorAll('input,select').forEach(el => {
  if(el.id!=='countryFrom'&&el.id!=='countryTo')
    el.addEventListener('input',scheduleRecalc);
});

populateCountries();
onCountryChange();
setLang('ru');
recalc();
</script>
